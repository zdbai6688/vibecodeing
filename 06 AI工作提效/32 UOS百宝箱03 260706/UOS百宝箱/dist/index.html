async function openPhase2Tool(id){
  document.getElementById('modalOverlay').classList.add('show')
  var item = PHASE2_ITEMS.find(function(i){ return i.id === id })
  document.getElementById('modalContent').innerHTML = '<button class="close-btn" onclick="closeModal()">\u2715</button>' +
    '<h2>' + (item ? item.ico : '') + ' ' + (item ? item.name : '') + '</h2>' +
    '<div class="sub">' + (item ? item.desc : '') + '</div>' +
    '<div style="margin-top:12px" id="phase2ToolContent"><div style="text-align:center;padding:40px;color:var(--text-sec)">\u23f3 正在加载...</div></div>' +
    '<div class="modal-footer"><button class="btn btn-outline" onclick="closeModal()">关闭</button></div>'
  setTimeout(function(){ loadPhase2Tool(id) }, 100)
}

function esc(str){
  if(typeof str !== 'string') return ''
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/\x27/g,'&#39;')
}

async function loadPhase2Tool(id){
  var el = document.getElementById('phase2ToolContent')
  if(!el) return

  // === 1. 系统启动项管理 ===
  if(id === 'startup-mgr'){
    el.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-sec)">\u23f3 正在获取启动项列表...</div>'
    try{
      var r = await window.phase2API.startup('list')
      if(r && r.success){
        var html = '<div style="display:flex;gap:8px;margin-bottom:12px"><button class="btn" onclick="addStartupItem()" style="padding:8px 18px;font-size:12px;background:var(--primary);color:#fff;border:none;border-radius:6px;cursor:pointer">\u2795 添加启动项</button><button class="btn btn-outline" onclick="closeModal();loadPhase2Tool(\'startup-mgr\')" style="padding:8px 18px;font-size:12px">\U0001f504 刷新</button></div>'
        if(r.items && r.items.length > 0){
          html += '<div style="background:var(--card-bg);border-radius:8px;overflow:hidden;box-shadow:var(--shadow)"><table class="monitor-table" style="font-size:12px;width:100%"><thead><tr><th style="width:60px">状态</th><th>名称</th><th style="width:180px">文件</th><th style="width:80px">操作</th></tr></thead><tbody>'
          for(var i = 0; i < r.items.length; i++){
            var item2 = r.items[i]
            var name = esc(item2.name)
            var file = esc(item2.file.split('/').pop())
            var enabled = item2.enabled ? '\u2705' : '\u274c'
            html += '<tr><td style="text-align:center;font-size:14px">' + enabled + '</td><td>' + name + '</td><td style="font-size:11px;color:#888">' + file + '</td><td>'
            if(item2.enabled){
              html += '<button class="btn btn-sm" onclick="toggleStartup(\'' + esc(item2.file) + '\',\'disable\')" style="color:var(--danger)">禁用</button>'
            } else {
              html += '<button class="btn btn-sm" onclick="toggleStartup(\'' + esc(item2.file) + '\',\'enable\')" style="color:var(--success)">启用</button>'
            }
            html += '</td></tr>'
          }
          html += '</tbody></table></div>'
        } else {
          html += '<div style="text-align:center;padding:30px;color:var(--text-sec)">暂无自启动项</div>'
        }
        el.innerHTML = html
      } else {
        el.innerHTML = '<div style="color:var(--danger);padding:20px;text-align:center">\u274c 获取失败: ' + (r && r.error ? r.error : '未知错误') + '</div>'
      }
    } catch(e){
      el.innerHTML = '<div style="color:var(--danger);padding:20px;text-align:center">\u274c 异常: ' + esc(e.message) + '</div>'
    }
    return
  }

  // === 2. 文件搜索 ===
  if(id === 'file-search'){
    el.innerHTML = '<div style="background:var(--card-bg);padding:16px;border-radius:8px;box-shadow:var(--shadow)">' +
      '<div style="display:flex;gap:8px;margin-bottom:10px">' +
        '<input id="fsKeyword" placeholder="搜索关键词" style="flex:1;padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:12px;outline:none;box-sizing:border-box" onkeydown="if(event.key===\'Enter\')doFileSearch()">' +
        '<button class="btn" onclick="doFileSearch()" style="padding:8px 20px;background:var(--primary);color:#fff;border:none;border-radius:6px;cursor:pointer">\U0001f50d 搜索</button></div>' +
      '<div style="margin-bottom:8px;display:flex;gap:8px;flex-wrap:wrap">' +
        '<select id="fsType" style="padding:6px 10px;border:1px solid #ddd;border-radius:6px;font-size:11px;outline:none"><option value="">所有类型</option><option value="f">文件</option><option value="d">目录</option></select>' +
        '<input id="fsMinSize" placeholder="最小大小(KB)" style="width:100px;padding:6px 10px;border:1px solid #ddd;border-radius:6px;font-size:11px;outline:none;box-sizing:border-box">' +
        '<input id="fsMaxSize" placeholder="最大大小(KB)" style="width:100px;padding:6px 10px;border:1px solid #ddd;border-radius:6px;font-size:11px;outline:none;box-sizing:border-box">' +

    try{
      var r2 = await window.phase2API.health()
      if(r2 && r2.success){
        var html2 = '<div style="display:flex;gap:8px;margin-bottom:12px"><button class="btn btn-outline" onclick="closeModal();loadPhase2Tool(\'health-check\')" style="padding:8px 18px;font-size:12px">\U0001f504 重新检查</button></div>'

  // === 4. USB启动盘制作 ===
  if(id === 'usb-maker'){
    el.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-sec)">\u23f3 正在检测USB设备...</div>'

  // === 5. 性能基准测试 ===
  if(id === 'benchmark'){

        '<button class="btn" onclick="runBenchmark(\'disk\')" style="padding:8px 18px;background:#fff;color:#333;border:1px solid #ddd;border-radius:6px;cursor:pointer">\U0001f4be 磁盘测试</button>' +
        '<button class="btn" onclick="runBenchmark(\'memory\')" style="padding:8px 18px;background:#fff;color:#333;border:1px solid #ddd;border-radius:6px;cursor:pointer">\U0001f9e0 内存测试</button>' +

        '<button class="btn" onclick="doBackup(\'backup\')" style="padding:8px 18px;background:var(--primary);color:#fff;border:none;border-radius:6px;cursor:pointer">\U0001f4be 一键备份</button>' +

  // === 7. 驱动管理 ===
  if(id === 'driver-mgr'){

  }

  // === 8. 远程桌面 ===
  if(id === 'remote-desktop'){

async function toggleStartup(file, action){
  var el = document.getElementById('phase2ToolContent')
  if(!el) return
  try{
    var r = await window.phase2API.startup(action, { file: file })
    if(r && r.success){
      loadPhase2Tool('startup-mgr')
    } else {
      el.innerHTML = '<div style="color:var(--danger);padding:10px;text-align:center">\u274c 操作失败: ' + (r && r.error ? r.error : '') + '</div>'
    }
  } catch(e){
    el.innerHTML = '<div style="color:var(--danger);padding:10px;text-align:center">\u274c 异常: ' + esc(e.message) + '</div>'
  }
}

async function addStartupItem(){
  var el = document.getElementById('phase2ToolContent')
  if(!el) return
  el.innerHTML = '<div style="background:var(--card-bg);padding:16px;border-radius:8px;box-shadow:var(--shadow)">' +
    '<div style="font-size:13px;font-weight:500;margin-bottom:12px">\u2795 添加自启动项</div>' +
    '<div style="margin-bottom:8px"><label style="font-size:12px;color:#888">名称: </label><br>' +
    '<input id="addStartupName" placeholder="程序名称" style="width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:12px;outline:none;box-sizing:border-box"></div>' +
    '<div style="margin-bottom:8px"><label style="font-size:12px;color:#888">命令路径: </label><br>' +
    '<input id="addStartupExec" placeholder="/usr/bin/xxx" style="width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:12px;outline:none;box-sizing:border-box"></div>' +
    '<button class="btn" onclick="doAddStartup()" style="padding:8px 18px;background:var(--primary);color:#fff;border:none;border-radius:6px;cursor:pointer">\u2705 确认添加</button> ' +
    '<button class="btn btn-outline" onclick="loadPhase2Tool(\'startup-mgr\')" style="padding:8px 18px">\u21a9 返回</button></div>'
}

async function doAddStartup(){
  var name = document.getElementById('addStartupName') ? document.getElementById('addStartupName').value.trim() : ''
  var execPath = document.getElementById('addStartupExec') ? document.getElementById('addStartupExec').value.trim() : ''
  if(!name || !execPath) return alert('请填写完整信息')
  var r = await window.phase2API.startup('add', { name: name, exec: execPath, desc: name })
  if(r && r.success){
    loadPhase2Tool('startup-mgr')
  } else {
    alert('添加失败: ' + (r && r.error ? r.error : '未知错误'))
  }
}

async function doFileSearch(){
  var el = document.getElementById('fsResult')
  var keyword = document.getElementById('fsKeyword') ? document.getElementById('fsKeyword').value.trim() : ''
  if(!el || !keyword) return
  el.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-sec)">\u23f3 正在搜索...</div>'
  var type = document.getElementById('fsType') ? document.getElementById('fsType').value : ''
  var minSize = document.getElementById('fsMinSize') ? document.getElementById('fsMinSize').value : ''
  var maxSize = document.getElementById('fsMaxSize') ? document.getElementById('fsMaxSize').value : ''
  var days = document.getElementById('fsDays') ? document.getElementById('fsDays').value : ''
  try{
    var r = await window.phase2API.search({ keyword: keyword, type: type, minSize: minSize, maxSize: maxSize, days: days })
    if(r && r.success && r.files && r.files.length > 0){
      var html = '<div style="color:var(--text-sec);margin-bottom:8px">找到 <b>' + r.files.length + '</b> 个文件</div>'
      var limit = Math.min(r.files.length, 100)
      for(var k = 0; k < limit; k++){
        var f = r.files[k]
        html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-bottom:1px solid var(--sidebar-logo-border)">'
        html += '<div style="flex:1;min-width:0"><div style="font-size:12px">' + esc(f.name) + '</div><div style="font-size:10px;color:#999;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(f.path) + '</div></div>'
        html += '<div style="flex-shrink:0;display:flex;gap:6px;align-items:center"><span style="font-size:10px;color:#999">' + esc(f.size || '') + '</span>'
        html += '<button class="btn btn-sm" onclick="window.shell.openPath(\'' + esc(f.path).replace(/\x27/g,"\'") + '\')" style="padding:2px 8px;font-size:10px">\U0001f4c2 打开</button></div></div>'
      }
      if(r.files.length > 100){
        html += '<div style="text-align:center;padding:8px;color:var(--text-sec);font-size:11px">... 仅显示前 100 个结果</div>'
      }
      el.innerHTML = html
    } else {
      el.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-sec)">未找到匹配的文件</div>'
    }
  } catch(e){
    el.innerHTML = '<div style="color:var(--danger);padding:10px;text-align:center">\u274c 搜索异常: ' + esc(e.message) + '</div>'
  }
}

async function selectUsbIso(){
  try{
    var r = await window.fileAPI.selectFile([{name:'ISO镜像',extensions:['iso']}])
    if(r && !r.canceled && r.filePaths && r.filePaths[0]){
      var inp = document.getElementById('usbIso')
      if(inp) inp.value = r.filePaths[0]
    }
  } catch(e){
    alert('选择文件失败: ' + e.message)
  }
}

async function doUsbCreate(){
  var device = document.getElementById('usbDevice') ? document.getElementById('usbDevice').value : ''
  var iso = document.getElementById('usbIso') ? document.getElementById('usbIso').value : ''
  var confirmed = document.getElementById('usbConfirm') ? document.getElementById('usbConfirm').checked : false
  var resultEl = document.getElementById('usbResult')
  if(!device || !iso){
    if(resultEl) resultEl.innerHTML = '<span style="color:var(--danger)">请选择USB设备和ISO镜像文件</span>'
    return
  }
  if(!confirmed){
    if(resultEl) resultEl.innerHTML = '<span style="color:var(--danger)">请确认已了解数据覆盖风险</span>'
    return
  }
  if(resultEl) resultEl.innerHTML = '<span style="color:var(--warning)">\u23f3 正在制作启动盘，这可能需要几分钟...</span>'
  try{
    var r = await window.phase2API.usb('create', { device: device, iso: iso })
    if(r && r.success){
      if(resultEl) resultEl.innerHTML = '<span style="color:var(--success)">\u2705 启动盘制作成功!</span>'
    } else {
      if(resultEl) resultEl.innerHTML = '<span style="color:var(--danger)">\u274c 制作失败: ' + (r && r.error ? r.error : '') + '</span>'
    }
  } catch(e){
    if(resultEl) resultEl.innerHTML = '<span style="color:var(--danger)">\u274c 异常: ' + esc(e.message) + '</span>'
  }
}

async function runBenchmark(type){
  var el = document.getElementById('benchResult')
  if(!el) return
  el.innerHTML = '<span style="color:var(--warning)">\u23f3 正在执行 ' + type + ' 测试...</span>'
  try{
    var r = await window.phase2API.benchmark(type)
    if(r && r.success){
      el.innerHTML = '<span style="color:var(--success)">\u2705 测试完成</span><br><pre style="margin-top:8px">' + esc(r.output||'') + '</pre>'
    } else {
      el.innerHTML = '<span style="color:var(--danger)">\u274c 测试失败: ' + (r && r.error ? r.error : '') + '</span>'
    }
  } catch(e){
    el.innerHTML = '<span style="color:var(--danger)">\u274c 异常: ' + esc(e.message) + '</span>'
  }
}

async function doBackup(action){
  var el = document.getElementById('backupResult')
  if(!el) return
  var actionNames = {backup:'备份', restore:'还原', export:'导出', import:'导入'}
  el.innerHTML = '<span style="color:var(--warning)">\u23f3 正在执行' + (actionNames[action]||action) + '...</span>'
  try{
    var params = {}
    if(action === 'export'){
      var savePath = await window.fileAPI.selectDirectory()
      if(!savePath) return
      params.path = savePath
    }
    if(action === 'import'){
      var file = await window.fileAPI.selectFile([{name:'备份文件',extensions:['tar.gz','tgz']}])
      if(!file) return
      params.file = file
    }
    var r = await window.phase2API.backup(action, params)
    if(r && r.success){
      el.innerHTML = '<span style="color:var(--success)">\u2705 ' + (actionNames[action]||action) + '成功!</span><br><pre style="margin-top:8px">' + esc(r.output||'') + '</pre>'
    } else {
      el.innerHTML = '<span style="color:var(--danger)">\u274c ' + (actionNames[action]||action) + '失败: ' + (r && r.error ? r.error : '') + '</span>'
    }
  } catch(e){
    el.innerHTML = '<span style="color:var(--danger)">\u274c 异常: ' + esc(e.message) + '</span>'
  }
}

async function doRemoteConnect(type){
  var host = document.getElementById('rdHost') ? document.getElementById('rdHost').value.trim() : ''
  var port = document.getElementById('rdPort') ? document.getElementById('rdPort').value.trim() : ''
  var password = document.getElementById('rdPassword') ? document.getElementById('rdPassword').value.trim() : ''
  var username = document.getElementById('rdUsername') ? document.getElementById('rdUsername').value.trim() : ''
  var resultEl = document.getElementById('remoteResult')
  if(!host){
    if(resultEl) resultEl.innerHTML = '<span style="color:var(--danger)">\u8bf7\u8f93\u5165\u8fdc\u7a0b\u5730\u5740</span>'
    return
  }
  if(resultEl) resultEl.innerHTML = '<span style="color:var(--warning)">\u23f3 \u6b63\u5728\u8fde\u63a5 ' + host + ':' + (port || '\u9ed8\u8ba4\u7aef\u53e3') + '...</span>'
  try{
    var r
    if(window.remoteDesktopAPI){
      r = await window.remoteDesktopAPI.connect({ type: type, host: host, port: port, password: password, username: username })
    } else {
      r = await window.phase2API.remote('connect', { type: type, host: host, port: port, password: password, username: username })
    }
    if(r && r.success){
      if(resultEl) resultEl.innerHTML = '<span style="color:var(--success)">\u2705 ' + esc(r.output||'\u8fde\u63a5\u547d\u4ee4\u5df2\u6267\u884c') + '</span><br><pre style="margin-top:8px">' + esc(r.output||'') + '</pre>'
    } else {
      if(resultEl) resultEl.innerHTML = '<span style="color:var(--danger)">\u274c \u8fde\u63a5\u5931\u8d25: ' + esc(r?.error||'') + '</span>'
    }
  } catch(e){
    if(resultEl) resultEl.innerHTML = '<span style="color:var(--danger)">\u274c \u5f02\u5e38: ' + esc(e.message) + '</span>'
  }
}

async function doSaveNewConnection(){

async function quickConnect(name){
  try{
    var r
    if(window.remoteDesktopAPI){
      r = await window.remoteDesktopAPI.listConnections()
    } else {
      r = await window.phase2API.remote('list-connections')
    }
    if(r && r.success && r.connections){
      var conn = r.connections.find(function(c){ return c.name === name })
      if(conn){
        document.getElementById('rdHost').value = conn.host
        document.getElementById('rdPort').value = conn.port || ''
        document.getElementById('rdUsername').value = conn.username || ''
        document.getElementById('rdPassword').value = conn.password || ''
        doRemoteConnect(conn.type || 'vnc')
      }
    }
  } catch(e){
    alert('\u8fde\u63a5\u5931\u8d25: ' + e.message)
  }
}

function escHtml(s){
  if(!s) return ''
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

async function loadShortcuts(){
  const tbody = document.getElementById('shortcutBody')
  const resultEl = document.getElementById('shortcutResult')
  if(!tbody) return
  tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;padding:20px;color:var(--text-sec)">⏳ 正在加载...</td></tr>'
  try{
    const res = await window.hotkeyAPI.listShortcuts()
    if(!res || !res.success){
      tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;padding:20px;color:var(--danger)">❌ ' + escHtml(res?.error || '获取快捷键列表失败') + '</td></tr>'
      return
    }
    const shortcuts = res.shortcuts || []
    window._allShortcuts = shortcuts
    renderShortcutTable(shortcuts)
    if(resultEl){
      resultEl.style.display = 'block'
      resultEl.innerHTML = '<span style="color:var(--success)">✅ 共找到 ' + shortcuts.length + ' 个快捷键</span>'
    }
    const countEl = document.getElementById('shortcutCount')
    if(countEl) countEl.textContent = '共 ' + shortcuts.length + ' 项'
  }catch(e){
    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;padding:20px;color:var(--danger)">❌ 加载失败: ' + escHtml(e.message) + '</td></tr>'
  }
}

function renderShortcutTable(shortcuts){
  const tbody = document.getElementById('shortcutBody')
  const searchVal = (document.getElementById('shortcutSearch')?.value || '').toLowerCase()
  if(!tbody) return
  if(!shortcuts || shortcuts.length === 0){
    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;padding:20px;color:var(--text-sec)">未找到快捷键（或系统不支持 gsettings）</td></tr>'
    return
  }
  const filtered = searchVal ? shortcuts.filter(s => (s.key || '').toLowerCase().includes(searchVal) || (s.value || '').toLowerCase().includes(searchVal)) : shortcuts
  if(filtered.length === 0){
    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;padding:20px;color:var(--text-sec)">未匹配到快捷键</td></tr>'
    return
  }
  tbody.innerHTML = filtered.map((s, idx) => {
    // 美化按键名称
    const keyName = s.key || '-'
    const keyVal = s.value || ''
    let displayVal = keyVal.replace(/</g,'&lt;').replace(/>/g,'&gt;')
    if(displayVal === "['']" || displayVal === "disabled" || displayVal === "@as []") displayVal = '<span style="color:var(--text-ter)">未设置</span>'
    return '<tr style="cursor:pointer" onclick="editShortcut(\'' + escHtml(keyName) + '\',\'' + escHtml(keyVal).replace(/'/g,"\'") + '\')">' +
      '<td style="font-weight:500">' + escHtml(keyName.replace(/_/g,' ').replace(/-/g,' ').replace(/^./,c=>c.toUpperCase())) + '</td>' +
      '<td><code style="background:var(--primary-light);padding:2px 8px;border-radius:4px;font-size:12px;color:var(--primary)">' + displayVal + '</code></td>' +
      '<td><button class="btn btn-sm btn-outline" onclick="event.stopPropagation();editShortcut(\'' + escHtml(keyName).replace(/'/g,"\'") + '\',\'' + escHtml(keyVal).replace(/'/g,"\'") + '\')">✏️ 编辑</button></td>' +
    '</tr>'
  }).join('')
  const countEl = document.getElementById('shortcutCount')
  if(countEl) countEl.textContent = '共 ' + shortcuts.length + ' 项' + (searchVal ? ' (匹配 ' + filtered.length + ' 项)' : '')
}

function filterShortcuts(val){

}

async function doAddShortcut(){
  const key = document.getElementById('editShortcutKey')?.value.trim()
  const cmd = document.getElementById('editShortcutCmd')?.value.trim()
  const resultEl = document.getElementById('addShortcutResult')
  if(!key || !cmd){
    if(resultEl){
      resultEl.style.display = 'block'
      resultEl.innerHTML = '<span style="color:var(--danger)">❌ 请填写快捷键和命令</span>'
    }
    return
  }
  if(resultEl){
    resultEl.style.display = 'block'
    resultEl.innerHTML = '<span style="color:var(--warning)">⏳ 正在设置...</span>'
  }
  try{
    const res = await window.hotkeyAPI.setShortcut(key, cmd)
    if(res && res.success){
      if(resultEl) resultEl.innerHTML = '<span style="color:var(--success)">✅ 快捷键已设置</span>'
      setTimeout(() => { closeModal(); loadShortcuts() }, 800)
    } else {

    }
  }catch(e){
    if(resultEl) resultEl.innerHTML = '<span style="color:var(--danger)">❌ ' + escHtml(e.message) + '</span>'
  }
}

async function doEditShortcut(key){
  const newVal = document.getElementById('editExistingKey')?.value.trim()
  const resultEl = document.getElementById('editShortcutResult')
  if(!newVal){
    if(resultEl){
      resultEl.style.display = 'block'
      resultEl.innerHTML = '<span style="color:var(--danger)">❌ 请输入快捷键</span>'
    }
    return
  }
  if(resultEl){
    resultEl.style.display = 'block'
    resultEl.innerHTML = '<span style="color:var(--warning)">⏳ 正在设置...</span>'
  }
  try{
    const res = await window.hotkeyAPI.setShortcut(key, newVal)
    if(res && res.success){
      if(resultEl) resultEl.innerHTML = '<span style="color:var(--success)">✅ 快捷键已更新</span>'
      setTimeout(() => { closeModal(); loadShortcuts() }, 800)
    } else {
      if(resultEl) resultEl.innerHTML = '<span style="color:var(--danger)">❌ ' + escHtml(res?.error || '设置失败') + '</span>'
    }
  }catch(e){
    if(resultEl) resultEl.innerHTML = '<span style="color:var(--danger)">❌ ' + escHtml(e.message) + '</span>'
  }
}

async function importShortcuts(){

  if(resultEl){
    resultEl.style.display = 'block'
    resultEl.innerHTML = '<span style="color:var(--warning)">⏳ 请选择配置文件...</span>'

}

async function refreshDocker() {
  const el = document.getElementById('dockerContent')
  if (!el) return
  el.innerHTML = '<p style="text-align:center;color:var(--text-ter)">\u23f3 正在获取 Docker 状态...</p>'
  try {
    if (!window.dockerAPI) {
      el.innerHTML = '<p style="text-align:center;color:var(--danger)">\u274c Docker API \u4e0d\u53ef\u7528</p>'
      return
    }
    const status = await window.dockerAPI.getStatus()
    if (!status || !status.success) {
      el.innerHTML = '<div class="card" style="padding:24px;text-align:center"><div style="font-size:40px;margin-bottom:8px">\U0001f433</div><div style="font-weight:500;font-size:15px;color:var(--text-sec)">Docker \u672a\u5b89\u88c5\u6216\u672a\u8fd0\u884c</div><p style="font-size:12px;color:var(--text-ter);margin:8px 0">\u8bf7\u5148\u5b89\u88c5 Docker \u5e76\u542f\u52a8 Docker \u670d\u52a1</p></div>'
      return
    }
    
    const containersRes = await window.dockerAPI.listContainers()
    const imagesRes = await window.dockerAPI.listImages()
    
    const containers = (containersRes && containersRes.success) ? (containersRes.containers || []) : []
    const images = (imagesRes && imagesRes.success) ? (imagesRes.images || []) : []
    const running = containers.filter(function(c) { return c.status && c.status.toLowerCase().includes('up') }).length
    
    var html = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px">' +
      '<div class="card" style="padding:16px;text-align:center"><div style="font-size:24px;font-weight:600;color:var(--primary)">' + containers.length + '</div><div style="font-size:12px;color:var(--text-sec)">\u603b\u5bb9\u5668</div></div>' +
      '<div class="card" style="padding:16px;text-align:center"><div style="font-size:24px;font-weight:600;color:var(--success)">' + running + '</div><div style="font-size:12px;color:var(--text-sec)">\u8fd0\u884c\u4e2d</div></div>' +
      '<div class="card" style="padding:16px;text-align:center"><div style="font-size:24px;font-weight:600;color:var(--primary)">' + images.length + '</div><div style="font-size:12px;color:var(--text-sec)">\u955c\u50cf\u6570</div></div>' +
      '<div class="card" style="padding:16px;text-align:center"><div style="font-size:24px;font-weight:600;color:var(--text)">' + (status.version || '-') + '</div><div style="font-size:12px;color:var(--text-sec)">Docker \u7248\u672c</div></div>' +
      '</div>'
    
    html += '<div class="card" style="padding:16px;margin-bottom:12px">'
    html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">'
    html += '<div style="font-weight:500;font-size:14px">\U0001f4e6 \u5bb9\u5668\u5217\u8868</div>'
    html += '<button class="btn btn-sm btn-outline" onclick="refreshDocker()" style="padding:3px 10px">\U0001f504 \u5237\u65b0</button>'
    html += '</div>'
    if (containers.length === 0) {
      html += '<div style="text-align:center;padding:20px;color:var(--text-ter);font-size:13px">\u6682\u65e0\u5bb9\u5668</div>'
    } else {
      html += '<div style="display:grid;gap:6px">'
      for (var i = 0; i < containers.length; i++) {
        var c = containers[i]
        var isRunning = c.status && c.status.toLowerCase().includes('up')
        html += '<div class="card" style="padding:10px 12px;border-left:3px solid ' + (isRunning ? 'var(--success)' : 'var(--border)') + '">'
        html += '<div style="display:flex;justify-content:space-between;align-items:center">'
        html += '<div style="flex:1;min-width:0">'
        html += '<div style="font-weight:500;font-size:13px">' + escHtml(c.name || c.id || '') + '</div>'
        html += '<div style="font-size:11px;color:var(--text-ter);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">\u955c\u50cf: ' + escHtml(c.image || '') + ' | ID: ' + escHtml((c.id||'').substring(0,12)) + '</div>'
        html += '</div>'
        html += '<div style="display:flex;gap:4px;align-items:center;flex-shrink:0">'
        html += '<span style="font-size:10px;padding:1px 6px;border-radius:6px;background:' + (isRunning ? '#e8f5e9;color:#2e7d32' : '#f5f5f5;color:#999') + '">' + escHtml(c.status || '') + '</span>'
        if (isRunning) {
          html += '<button class="btn btn-sm" style="background:var(--warning);color:#fff;border:none;padding:1px 8px;border-radius:3px;font-size:11px;cursor:pointer" onclick="dockerStop(\'' + c.id + '\')">\u23f9</button>'
        } else {
          html += '<button class="btn btn-sm" style="background:var(--success);color:#fff;border:none;padding:1px 8px;border-radius:3px;font-size:11px;cursor:pointer" onclick="dockerStart(\'' + c.id + '\')">\u25b6</button>'
        }
        html += '<button class="btn btn-sm" style="background:var(--primary);color:#fff;border:none;padding:1px 8px;border-radius:3px;font-size:11px;cursor:pointer" onclick="dockerLogs(\'' + c.id + '\')">\U0001f4cb</button>'
        html += '<button class="btn btn-sm" style="background:var(--danger);color:#fff;border:none;padding:1px 8px;border-radius:3px;font-size:11px;cursor:pointer" onclick="if(confirm(\'\u786e\u8ba4\u5220\u9664\u5bb9\u5668 ' + escHtml(c.name||c.id) + '?\'))dockerRemove(\'' + c.id + '\')">\U0001f5d1</button>'
        html += '</div></div></div>'
      }
      html += '</div>'
    }
    html += '</div>'
    
    html += '<div class="card" style="padding:16px">'
    html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">'
    html += '<div style="font-weight:500;font-size:14px">\U0001f5e5 \u955c\u50cf\u5217\u8868</div>'
    html += '<div style="display:flex;gap:6px">'
    html += '<input id="dockerPullInput" placeholder="\u955c\u50cf\u540d\u79f0 (\u5982 nginx:latest)" style="padding:4px 8px;border:1px solid var(--border);border-radius:4px;font-size:12px;width:180px">'
    html += '<button class="btn btn-sm btn-primary" onclick="dockerPull()" style="padding:3px 10px">\U0001f4e5 \u62c9\u53d6</button>'
    html += '</div></div>'
    if (images.length === 0) {
      html += '<div style="text-align:center;padding:20px;color:var(--text-ter);font-size:13px">\u6682\u65e0\u955c\u50cf</div>'
    } else {
      html += '<div style="display:grid;gap:6px">'
      for (var i = 0; i < images.length; i++) {
        var img = images[i]
        html += '<div class="card" style="padding:8px 12px">'
        html += '<div style="display:flex;justify-content:space-between;align-items:center">'
        html += '<div><span style="font-weight:500;font-size:13px">' + escHtml(img.repo || '') + '</span><span style="font-size:12px;color:var(--text-sec);margin-left:4px">:' + escHtml(img.tag || 'latest') + '</span><span style="font-size:11px;color:var(--text-ter);margin-left:8px">' + escHtml(img.id || '').substring(0,12) + '</span></div>'
        html += '<div style="display:flex;gap:4px;align-items:center">'
        html += '<span style="font-size:11px;color:var(--text-sec)">' + escHtml(img.size || '') + '</span>'
        html += '<button class="btn btn-sm" style="background:var(--danger);color:#fff;border:none;padding:1px 8px;border-radius:3px;font-size:11px;cursor:pointer" onclick="if(confirm(\'\u5220\u9664\u955c\u50cf ' + escHtml(img.repo||img.id) + '?\'))dockerRemoveImage(\'' + img.id + '\')">\U0001f5d1</button>'
        html += '</div></div></div>'
      }
      html += '</div>'
    }
    html += '</div>'
    
    if (status.status) {
      html += '<div class="card" style="padding:12px;margin-top:12px">'
      html += '<div style="font-weight:500;font-size:13px;margin-bottom:6px">\u2139\ufe0f Docker \u670d\u52a1\u72b6\u6001</div>'
      html += '<pre style="font-size:11px;color:var(--text-sec);background:#f8f9fa;padding:8px;border-radius:4px;max-height:120px;overflow:auto;margin:0">' + escHtml(status.status) + '</pre>'
      html += '</div>'
    }
    
    el.innerHTML = html
  } catch(e) {
    el.innerHTML = '<p style="text-align:center;color:var(--danger)">\u274c \u52a0\u8f7d\u5931\u8d25: ' + escHtml(e.message) + '</p>'
  }
}

    el.appendChild(div)
  } else {
    alert('\u83b7\u53d6\u65e5\u5fd7\u5931\u8d25: ' + (res?.error || '\u672a\u77e5\u9519\u8bef'))
  }

async function dockerPull() {
  var input = document.getElementById('dockerPullInput')
  if (!input || !input.value.trim()) { alert('\u8bf7\u8f93\u5165\u955c\u50cf\u540d\u79f0'); return }
  if (!window.dockerAPI) return
  var name = input.value.trim()
  input.disabled = true
  input.value = '\u23f3 \u62c9\u53d6\u4e2d...'
  var res = await window.dockerAPI.pullImage(name)
  input.disabled = false
  if (res && res.success) {
    input.value = ''
    refreshDocker()
  } else {
    input.value = name
    alert('\u62c9\u53d6\u5931\u8d25: ' + (res?.error || '\u672a\u77e5\u9519\u8bef'))
  }
}

      html += '</div>'

    }
    html += '</div>'
    
    html += '<div class="card" style="padding:20px;margin-bottom:12px">'
    html += '<div style="font-size:16px;font-weight:600;margin-bottom:6px">\u2705 \u5347\u7ea7\u524d\u68c0\u67e5</div>'
    if (preflightRes && preflightRes.success) {
      var checks = preflightRes.checks || preflightRes.items || []
      if (checks.length === 0) {
        html += '<div style="text-align:center;padding:12px;color:var(--text-ter);font-size:13px">\u672a\u6267\u884c\u68c0\u67e5</div>'
      } else {
        html += '<div style="display:grid;gap:6px">'
        for (var i = 0; i < checks.length; i++) {
          var ch = checks[i]
          var passed = ch.passed || ch.status === 'ok'
          html += '<div style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:' + (passed ? '#f1f8e9' : '#fce4ec') + ';border-radius:6px;font-size:12px">'
          html += '<span>' + (passed ? '\u2705' : '\u274c') + '</span>'
          html += '<span style="flex:1">' + escHtml(ch.name || ch.check || ch.item || '') + '</span>'
          if (ch.message) html += '<span style="color:var(--text-ter)">' + escHtml(ch.message) + '</span>'
          html += '</div>'
        }
        html += '</div>'
      }
    } else {
      html += '<div style="text-align:center;padding:12px;color:var(--text-ter);font-size:13px">' + (preflightRes?.error ? escHtml(preflightRes.error) : '\u65e0\u6cd5\u6267\u884c\u68c0\u67e5') + '</div>'
    }
    html += '</div>'
    
    html += '<div class="card" style="padding:20px">'
    html += '<div style="font-size:16px;font-weight:600;margin-bottom:6px">\u21a9\ufe0f \u5347\u7ea7\u56de\u6eda</div>'
    html += '<p style="font-size:12px;color:var(--text-sec);margin:0 0 12px">\u5982\u679c\u5347\u7ea7\u51fa\u73b0\u95ee\u9898\uff0c\u53ef\u4ee5\u56de\u6eda\u5230\u4e4b\u524d\u7684\u7cfb\u7edf\u7248\u672c</p>'
    html += '<div style="display:flex;gap:8px;align-items:center">'
    html += '<input id="rollbackPwd" type="password" placeholder="\u9700\u8981\u7ba1\u7406\u5458\u5bc6\u7801" style="flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px">'
    html += '<button class="btn btn-primary" style="padding:8px 20px;border-radius:6px;cursor:pointer" onclick="rollbackUpgrade()">\u21a9\ufe0f \u6267\u884c\u56de\u6eda</button>'
    html += '</div></div>'
    
    el.innerHTML = html
  } catch(e) {
    el.innerHTML = '<p style="text-align:center;color:var(--danger)">\u274c \u52a0\u8f7d\u5931\u8d25: ' + escHtml(e.message) + '</p>'

async function startUpgradeDlg() {

async function confirmUpgrade() {
  var pwd = document.getElementById('_upgradePwd')?.value
  if (!pwd) { alert('\u8bf7\u8f93\u5165\u5bc6\u7801'); return }
  document.getElementById('modalOverlay').classList.remove('show')
  if (!window.upgradeAPI) return
  var el = document.getElementById('upgradeContent')
  el.innerHTML = '<p style="text-align:center;color:var(--text-ter)">\u23f3 \u6b63\u5728\u6267\u884c\u5347\u7ea7\uff0c\u8bf7\u8010\u5fc3\u7b49\u5f85...</p>'
  var res = await window.upgradeAPI.startUpgrade(pwd)
  if (res && res.success) {
    var monitorInterval = setInterval(async function() {
      var prog = await window.upgradeAPI.getProgress()
      if (prog && prog.success) {
        var pct = prog.percent || prog.progress || 0
        var msg = prog.message || prog.status || ''
        el.innerHTML = '<div style="text-align:center;padding:20px"><div style="font-size:40px;margin-bottom:8px">\u2b06\ufe0f</div><div style="font-weight:500;font-size:15px;margin-bottom:8px">\u5347\u7ea7\u4e2d...</div><div style="width:100%;max-width:400px;margin:0 auto;background:#e0e0e0;border-radius:10px;height:20px;overflow:hidden"><div style="height:100%;width:' + pct + '%;background:var(--primary);transition:width 0.5s;border-radius:10px"></div></div><div style="font-size:12px;color:var(--text-sec);margin-top:8px">' + escHtml(msg) + '</div></div>'
      }
      if (prog && (prog.finished || prog.done || prog.error)) {
        clearInterval(monitorInterval)
        var finalMsg = prog.error ? ('\u274c \u5347\u7ea7\u5931\u8d25: ' + escHtml(prog.error)) : '\u2705 \u5347\u7ea7\u5b8c\u6210\uff01'
        el.innerHTML = '<div style="text-align:center;padding:20px"><div style="font-size:40px;' + (prog.error ? 'color:var(--danger)' : 'color:var(--success)') + ';margin-bottom:8px">' + (prog.error ? '\u274c' : '\u2705') + '</div><div style="font-weight:500;font-size:15px">' + finalMsg + '</div><button class="btn btn-primary" style="margin-top:12px;padding:8px 20px;border-radius:6px;cursor:pointer" onclick="refreshUpgrade()">\u8fd4\u56de</button></div>'
      }
    }, 2000)
  } else {
    el.innerHTML = '<p style="text-align:center;color:var(--danger)">\u274c \u5347\u7ea7\u542f\u52a8\u5931\u8d25: ' + escHtml(res?.error || '\u672a\u77e5\u9519\u8bef') + '</p>'
  }
}

async function rollbackUpgrade() {
  if (!window.upgradeAPI) return
  var pwd = document.getElementById('rollbackPwd')?.value
  if (!pwd) { alert('\u8bf7\u8f93\u5165\u7ba1\u7406\u5458\u5bc6\u7801'); return }
  if (!confirm('\u786e\u8ba4\u8981\u6267\u884c\u7cfb\u7edf\u5347\u7ea7\u56de\u6eda\uff1f\u6b64\u64cd\u4f5c\u53ef\u80fd\u9700\u8981\u8f83\u957f\u65f6\u95f4')) return
  var el = document.getElementById('upgradeContent')
  el.innerHTML = '<p style="text-align:center;color:var(--text-ter)">\u23f3 \u6b63\u5728\u6267\u884c\u56de\u6eda...</p>'
  var res = await window.upgradeAPI.rollback(pwd)
  if (res && res.success) {
    el.innerHTML = '<div style="text-align:center;padding:20px;color:var(--success)">\u2705 \u56de\u6eda\u5b8c\u6210\uff01' + (res.message ? '<br><span style="font-size:12px;color:var(--text-sec)">' + escHtml(res.message) + '</span>' : '') + '</div>'
  } else {
    el.innerHTML = '<p style="text-align:center;color:var(--danger)">\u274c \u56de\u6eda\u5931\u8d25: ' + escHtml(res?.error || '\u672a\u77e5\u9519\u8bef') + '</p>'
  }
}

    html += '<div class="card" style="padding:16px;margin-bottom:12px">'

    el.innerHTML = '<p style="text-align:center;color:var(--danger)">\u274c \u52a0\u8f7d\u5931\u8d25: ' + escHtml(e.message) + '</p>'

async function exportAssetCSV() {
  if (!window.assetAPI) return
  var res = await window.assetAPI.exportReport('csv')
  if (res && res.success) {
    alert('\u5bfc\u51fa\u6210\u529f\uff01' + (res.message ? '\n' + res.message : ''))
    if (res.path) {
      var path = res.path
      var dir = path.substring(0, path.lastIndexOf('/'))
      try {
        await (window.toolAPI?.invoke || window.systemAPI?.invoke)('shell:openPath', dir)
      } catch(e) {}
    }
  } else {
    alert('\u5bfc\u51fa\u5931\u8d25: ' + (res?.error || '\u672a\u77e5\u9519\u8bef'))
  }
}

async function execBatchCmd() {
  var hostsText = document.getElementById('batchHosts')?.value
  var cmd = document.getElementById('batchCmd')?.value
  var pwd = document.getElementById('batchPwd')?.value
  if (!hostsText || !cmd) { alert('\u8bf7\u586b\u5199\u4e3b\u673a\u5217\u8868\u548c\u547d\u4ee4'); return }
  var hosts = hostsText.split('\n').map(function(h) { return h.trim() }).filter(function(h) { return h })
  var resultEl = document.getElementById('batchResult')
  if (!resultEl) return
  resultEl.style.display = 'block'
  resultEl.textContent = '\u23f3 \u6b63\u5728\u6267\u884c...'
  if (!window.remoteAPI) return
  var res = await window.remoteAPI.batchExec(hosts, cmd, pwd)
  if (res && res.success) {
    var output = res.output || res.results || ''
    if (Array.isArray(output)) {
      resultEl.textContent = output.map(function(o) {
        return '[' + (o.host || '') + '] ' + (o.output || o.stdout || o.error || '')
      }).join('\n---\n')
    } else {
      resultEl.textContent = String(output)
    }
  } else {
    resultEl.textContent = '\u274c \u6267\u884c\u5931\u8d25: ' + (res?.error || '\u672a\u77e5\u9519\u8bef')
  }
}

async function execTransfer() {
  var host = document.getElementById('transferHost')?.value
  var localPath = document.getElementById('transferLocalPath')?.value
  var remotePath = document.getElementById('transferRemotePath')?.value
  var pwd = document.getElementById('transferPwd')?.value
  if (!host || !localPath || !remotePath) { alert('\u8bf7\u586b\u5199\u5b8c\u6574\u4fe1\u606f'); return }
  var resultEl = document.getElementById('transferResult')
  if (!resultEl) return
  resultEl.style.display = 'block'
  resultEl.innerHTML = '<p style="color:var(--text-ter)">\u23f3 \u6b63\u5728\u4f20\u8f93\u6587\u4ef6...</p>'
  if (!window.remoteAPI) return
  var res = await window.remoteAPI.transferFile(host, localPath, remotePath, pwd)
  if (res && res.success) {
    resultEl.innerHTML = '<p style="color:var(--success)">\u2705 \u6587\u4ef6\u4f20\u8f93\u6210\u529f' + (res.message ? '<br>' + escHtml(res.message) : '') + '</p>'
  } else {
    resultEl.innerHTML = '<p style="color:var(--danger)">\u274c \u4f20\u8f93\u5931\u8d25: ' + escHtml(res?.error || '\u672a\u77e5\u9519\u8bef') + '</p>'

}


async function refreshVpnList() {
  const el = document.getElementById('vpnContent')
  if (!el) return
  el.innerHTML = '<p style="text-align:center;color:var(--text-ter)">⏳ 正在获取 VPN 连接列表...</p>'
  try {
    const res = window.vpnAPI ? await window.vpnAPI.listConnections() : null
    if (!res || !res.success) {
      el.innerHTML = '<p style="text-align:center;color:var(--danger)">❌ 获取失败: ' + escHtml(res?.error || '未知错误') + '</p>'
      return
    }
    const conns = res.connections || []
    const details = res.details || {}
    var toolsHtml = ''
    var toolsRes = window.vpnAPI ? await window.vpnAPI.checkTools() : null
    if (toolsRes && toolsRes.success && toolsRes.missing && toolsRes.missing.length > 0) {
      toolsHtml = '<div style="background:#fff3cd;color:#856404;padding:10px 14px;border-radius:8px;font-size:12px;margin-bottom:16px">⚠️ 部分 VPN 工具未安装: ' + toolsRes.missing.join(', ') + ' <button class="btn btn-sm" style="margin-left:8px;background:var(--primary);color:#fff;border:none;padding:2px 10px;border-radius:4px;cursor:pointer" onclick="installVpnTools()">📥 安装工具</button></div>'
    }
    var html = toolsHtml
    html += '<div class="card" style="padding:16px">'
    html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">'
    html += '<div style="font-weight:500;font-size:14px">🔌 VPN 连接列表</div>'
    html += '<div style="display:flex;gap:6px">'
    html += '<button class="btn btn-sm btn-primary" onclick="showAddVpnDialog()">➕ 新建连接</button>'
    html += '<button class="btn btn-sm btn-outline" onclick="showImportVpnDialog()">📥 导入配置</button>'
    html += '<button class="btn btn-sm btn-outline" onclick="refreshVpnList()">🔄 刷新</button>'
    html += '</div></div>'
    if (conns.length === 0) {
      html += '<div style="text-align:center;padding:24px;color:var(--text-ter);font-size:13px">暂无 VPN 连接，点击"新建连接"或"导入配置"添加</div>'
    } else {
      html += '<div style="display:grid;gap:8px">'
      for (var i = 0; i < conns.length; i++) {
        var c = conns[i]
        var d = details[c.name] || {}
        var isActive = c.active
        var vpnType = d.vpnType || c.type || '未知'
        var addr = d.address ? d.address.split('/')[0] : ''
        var autoReconnect = d.autoReconnect
        html += '<div class="card" style="padding:12px;border-left:4px solid ' + (isActive ? 'var(--success)' : 'var(--border)') + '">'
        html += '<div style="display:flex;justify-content:space-between;align-items:center">'
        html += '<div style="flex:1">'
        html += '<div style="font-weight:500;font-size:14px">' + escHtml(c.name) + '</div>'
        html += '<div style="font-size:11px;color:var(--text-sec);margin-top:2px">'
        html += '类型: ' + escHtml(vpnType)
        if (addr) html += ' · IP: ' + escHtml(addr)
        if (autoReconnect) html += ' · 🔄 自动重连'
        html += '</div></div>'
        html += '<div style="display:flex;gap:6px;align-items:center;flex-shrink:0">'
        html += '<span style="font-size:11px;padding:2px 8px;border-radius:8px;background:' + (isActive ? '#e8f5e9;color:#2e7d32' : '#f5f5f5;color:#999') + '">' + (isActive ? '● 已连接' : '○ 已断开') + '</span>'
        html += '<button class="btn btn-sm" style="background:' + (isActive ? 'var(--warning);color:#fff' : 'var(--success);color:#fff') + ';border:none;padding:2px 10px;border-radius:4px;cursor:pointer" onclick="' + (isActive ? "disconnectVpn('" + c.name + "')" : "connectVpn('" + c.name + "')") + '">' + (isActive ? '⏹ 断开' : '▶ 连接') + '</button>'
        html += '<button class="btn btn-sm btn-outline" style="padding:2px 8px" onclick="showVpnDetail(\'' + c.name + '\')">📋 详情</button>'
        html += '<button class="btn btn-sm" style="background:var(--danger);color:#fff;border:none;padding:2px 8px;border-radius:4px;cursor:pointer" onclick="if(confirm(\'确认删除 ' + c.name + '?\'))deleteVpn(\'' + c.name + '\')">🗑</button>'
        html += '</div></div></div>'
      }
      html += '</div>'
    }
    html += '</div>'
    if (conns.length > 0) {
      html += '<div class="card" style="padding:16px;margin-top:12px">'
      html += '<div style="font-weight:500;font-size:14px;margin-bottom:10px">⚙️ 批量管理</div>'
      html += '<div style="display:flex;gap:8px;flex-wrap:wrap">'
      html += '<select id="vpnBatchSelect" style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:#fff">'
      html += '<option value="">-- 选择连接 --</option>'
      for (var i = 0; i < conns.length; i++) {
        html += '<option value="' + escHtml(conns[i].name) + '">' + escHtml(conns[i].name) + '</option>'
      }
      html += '</select>'
      html += '<button class="btn btn-sm btn-outline" onclick="exportVpnConfig()">📤 导出配置</button>'
      html += '<button class="btn btn-sm btn-outline" onclick="toggleAutoReconnect()">🔄 切换自动重连</button>'
      html += '</div></div>'
    }
    el.innerHTML = html
  } catch(e) {
    el.innerHTML = '<p style="text-align:center;color:var(--danger)">❌ 加载失败: ' + escHtml(e.message) + '</p>'
  }
}

async function doAddVpn() {
  var name = document.getElementById('vpnNewName')?.value || 'My VPN'
  var type = document.getElementById('vpnNewType')?.value || 'l2tp'
  var gateway = document.getElementById('vpnNewGateway')?.value || ''
  closeModal()

  var res = await window.vpnAPI.addConnection({ name: name, type: type, gateway: gateway })
  if (res && res.success) { await refreshVpnList() }
  else { alert('创建失败: ' + (res?.error || '未知错误')) }

function showImportVpnDialog() {
  showModal(
    '<h3 style="font-size:16px;font-weight:600;margin:0 0 12px">📥 导入 VPN 配置</h3>' +
    '<p style="font-size:12px;color:var(--text-sec);margin-bottom:12px">支持 .ovpn (OpenVPN)、.pcf (L2TP)、.conf 格式</p>' +
    '<button class="btn btn-primary" onclick="doImportVpn()">📁 选择配置文件</button>' +
    '<div id="importVpnResult" style="margin-top:12px;font-size:12px"></div>'
  )
}
async function doImportVpn() {
  var resultEl = document.getElementById('importVpnResult')
  if (!resultEl) return
  if (!window.fileAPI) { resultEl.textContent = '❌ 文件选择器不可用'; return }
  var filePath = await window.fileAPI.selectFile([{name:'VPN配置',extensions:['ovpn','conf','pcf','txt']}])
  if (!filePath) return
  resultEl.textContent = '⏳ 正在导入...'
  if (!window.vpnAPI) { resultEl.textContent = '❌ VPN API 不可用'; return }
  var res = await window.vpnAPI.importConfig(filePath)
  if (res && res.success) {
    resultEl.textContent = '✅ ' + (res.message || '配置导入成功')
    closeModal()
    await refreshVpnList()
  } else {
    resultEl.textContent = '❌ 导入失败: ' + (res?.error || '未知错误')
  }
}
async function exportVpnConfig() {
  var select = document.getElementById('vpnBatchSelect')
  if (!select || !select.value) { alert('请先选择要导出的连接'); return }
  var name = select.value
  if (!window.fileAPI) { alert('文件保存不可用'); return }
  var savePath = await window.fileAPI.saveFileDialog(name + '.nmconnection', [{name:'NetworkManager配置',extensions:['nmconnection']}])
  if (!savePath) return
  if (!window.vpnAPI) return
  var dir = savePath.substring(0, savePath.lastIndexOf('/'))
  var res = await window.vpnAPI.exportConfig(name, dir)
  if (res && res.success) {
    alert('✅ 配置已导出到: ' + res.path)
  } else {
    alert('❌ 导出失败: ' + (res?.error || '未知错误'))
  }
}
async function toggleAutoReconnect() {
  var select = document.getElementById('vpnBatchSelect')
  if (!select || !select.value) { alert('请先选择连接'); return }
  var name = select.value
  if (!window.vpnAPI) return
  var listRes = await window.vpnAPI.listConnections()
  if (!listRes || !listRes.success) return
  var detail = listRes.details?.[name]
  var newState = !(detail?.autoReconnect)
  var res = await window.vpnAPI.setAutoReconnect(name, newState)
  if (res && res.success) { await refreshVpnList() }
  else { alert('设置失败: ' + (res?.error || '未知错误')) }
}
async function installVpnTools() {
  if (!window.vpnAPI) return
  var password = prompt('需要 sudo 权限安装 VPN 工具包，请输入密码:')
  if (!password) return
  var el = document.getElementById('vpnContent')
  if (el) el.innerHTML = '<p style="text-align:center;color:var(--text-ter)">⏳ 正在安装 VPN 工具包...</p>'
  var res = await window.vpnAPI.installTools(password)
  if (res && res.success) { await refreshVpnList() }
  else {
    if (el) el.innerHTML = '<p style="text-align:center;color:var(--danger)">❌ 安装失败: ' + escHtml(res?.error || '未知错误') + '</p>'
  }
}

async function renderDiskAnalyzer(el){
  el.innerHTML=`<div style="max-width:900px;margin:0 auto">

      <button class="btn btn-primary" onclick="diskAnalyzerScan()">📊 扫描磁盘使用</button>

    </div>
    <div id="diskAnalyzerResult">
      <div style="text-align:center;padding:40px;color:var(--text-sec)">点击「扫描磁盘使用」开始分析磁盘空间</div>

async function diskAnalyzerScan(){
  var el=document.getElementById('diskAnalyzerResult')
  if(!el)return
  el.innerHTML='<div style="text-align:center;padding:40px;color:var(--text-sec)">⏳ 正在扫描磁盘使用情况...</div>'
  try{
    var res=await window.diskAPI?.getDiskUsage()
    if(!res||!res.success){el.innerHTML='<div style="text-align:center;padding:40px;color:var(--danger)">❌ 获取磁盘信息失败</div>';return}
    var html='<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px">'
    ;(res.mounts||[]).forEach(function(m){
      var pct=parseFloat(m.usePercent)||0
      var color=pct>85?'var(--danger)':pct>60?'var(--warning)':'var(--success)'
      var total=window.fileAPI?.formatSize?window.fileAPI.formatSize(m.total):(m.total||'-')
      var used=window.fileAPI?.formatSize?window.fileAPI.formatSize(m.used):(m.used||'-')
      var free=window.fileAPI?.formatSize?window.fileAPI.formatSize(m.free):(m.free||'-')
      html+='<div style="background:var(--card-bg);border-radius:10px;padding:16px;box-shadow:var(--shadow)">'
      html+='<div style="font-size:14px;font-weight:600;margin-bottom:6px">💾 '+escHtml(m.mount||'')+'</div>'
      html+='<div style="font-size:11px;color:var(--text-sec);margin-bottom:8px">'+escHtml(m.fs||'')+' · 总容量: '+total+'</div>'
      html+='<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span>已用: '+used+'</span><span style="font-weight:600;color:'+color+'">'+pct+'%</span></div>'
      html+='<div style="height:8px;background:#f0f0f0;border-radius:4px;overflow:hidden"><div style="height:100%;width:'+pct+'%;border-radius:4px;background:'+color+';transition:width 0.5s"></div></div>'
      html+='<div style="font-size:11px;color:var(--text-sec);margin-top:4px">可用: '+free+'</div>'
      html+='</div>'
    })
    html+='</div>'
    el.innerHTML=html
  }catch(e){el.innerHTML='<div style="text-align:center;padding:40px;color:var(--danger)">❌ 扫描失败: '+esc(e.message)+'</div>'}
}

async function diskAnalyzerBigFiles(){
  var el=document.getElementById('diskAnalyzerResult')
  if(!el)return
  el.innerHTML='<div style="text-align:center;padding:40px;color:var(--text-sec)">⏳ 正在扫描大文件（可能较慢）...</div>'
  try{
    var res=await window.diskAPI?.getBigFiles()
    if(!res||!res.success){el.innerHTML='<div style="text-align:center;padding:40px;color:var(--danger)">❌ 扫描大文件失败</div>';return}
    var files=res.files||[]
    if(files.length===0){el.innerHTML='<div style="text-align:center;padding:40px;color:var(--text-sec)">未找到超过100MB的大文件</div>';return}

async function sysLogSearch(){
  var el=document.getElementById('sysLogResult')
  if(!el)return
  el.innerHTML='<div style="text-align:center;padding:40px;color:var(--text-sec)">⏳ 正在搜索日志...</div>'
  var keyword=document.getElementById('logSearchInput')?.value||''
  var priority=document.getElementById('logPrioritySelect')?.value||''
  var boot=document.getElementById('logBootSelect')?.value||''
  try{
    var res=await window.logAPI?.search({keyword:keyword,priority:priority,boot:boot})
    if(!res||!res.success){el.innerHTML='<div style="text-align:center;padding:40px;color:var(--danger)">❌ 获取日志失败'+(res?': '+escHtml(res.error):'')+'</div>';return}
    var lines=res.lines||[]
    if(lines.length===0){el.innerHTML='<div style="text-align:center;padding:40px;color:var(--text-sec)">未找到匹配的日志条目</div>';return}
    var html='<div style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">'
    html+='<span style="font-size:13px;font-weight:600">📋 共 '+lines.length+' 条日志</span>'
    html+='<span style="font-size:11px;color:var(--text-sec)">来源: journalctl</span></div>'
    html+='<div class="modal-output" style="max-height:500px;font-size:12px;line-height:1.6">'
    lines.forEach(function(l){
      var cls='l out'
      if(l.indexOf('error')>=0||l.indexOf('Error')>=0||l.indexOf('ERROR')>=0) cls='l error'
      else if(l.indexOf('warn')>=0||l.indexOf('Warn')>=0) cls='l info'
      html+='<div class="'+cls+'">'+escHtml(l)+'</div>'
    })
    html+='</div>'
    el.innerHTML=html
  }catch(e){el.innerHTML='<div style="text-align:center;padding:40px;color:var(--danger)">❌ 搜索失败: '+esc(e.message)+'</div>'}
}

async function renderNetDiag(el){
  el.innerHTML='<div style="max-width:900px;margin:0 auto"><div style="background:var(--card-bg);border-radius:10px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px"><h3 style="font-size:14px;margin-bottom:10px">🌐 网络诊断工具</h3><div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap"><div style="flex:1;min-width:200px"><label style="font-size:12px;color:var(--text-sec);margin-bottom:4px;display:block">目标地址</label><input id="netDiagTarget" type="text" placeholder="域名或IP (如 baidu.com)" value="" style="width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:13px;outline:none" onkeydown="if(event.key===\'Enter\')startNetDiag()"></div><div style="display:flex;align-items:flex-end;gap:6px"><button class="btn btn-primary" onclick="startNetDiag()">🔍 执行诊断</button><button class="btn btn-outline" onclick="document.getElementById(\'netDiagResult\').innerHTML=\'\'">🗑 清空</button></div></div><div style="display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-sec)"><label><input type="checkbox" id="diagPing" checked> Ping</label><label><input type="checkbox" id="diagTraceroute" checked> Traceroute</label><label><input type="checkbox" id="diagNslookup" checked> NSLookup</label><label><input type="checkbox" id="diagCurl" checked> Curl (HTTP)</label></div></div><div id="netDiagResult"></div></div>'
}

async function startNetDiag(){
  var target=document.getElementById('netDiagTarget')?.value?.trim()
  if(!target){alert('请输入目标地址');return}
  var resultEl=document.getElementById('netDiagResult')
  if(!resultEl)return
  resultEl.innerHTML='<div style="text-align:center;padding:20px;color:var(--text-sec)">⏳ 正在执行诊断...</div>'
  var checks=[]
  if(document.getElementById('diagPing')?.checked) checks.push('ping')
  if(document.getElementById('diagTraceroute')?.checked) checks.push('traceroute')
  if(document.getElementById('diagNslookup')?.checked) checks.push('nslookup')
  if(document.getElementById('diagCurl')?.checked) checks.push('curl')
  try{
    var res=await window.netDiagAPI?.run({target:target,checks:checks})
    if(!res||!res.success){
      resultEl.innerHTML='<div style="text-align:center;padding:40px;color:var(--danger)">❌ 诊断失败'+(res?': '+escHtml(res.error):'无法连接到主进程')+'</div>'
      return
    }
    var results=res.results||{}
    var html=''
    for(var k of checks){
      var r=results[k]
      if(!r) continue
      html+='<div style="background:var(--card-bg);border-radius:8px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden">'
      html+='<div style="padding:10px 16px;background:#f8f9fa;font-size:13px;font-weight:500;border-bottom:1px solid var(--border)">'
      html+='<span style="color:'+(r.success?'var(--success)':'var(--danger)')+'">'+(r.success?'✅':'❌')+'</span> '
      html+=k.toUpperCase()+' — '+target+'</div>'
      if(r.output) html+='<div class="terminal-body" style="margin:0;padding:10px 16px;font-size:12px;line-height:1.6">'+escHtml(r.output)+'</div>'
      if(r.error) html+='<div style="padding:8px 16px;color:var(--danger);font-size:12px">❌ '+escHtml(r.error)+'</div>'
      html+='</div>'
    }
    resultEl.innerHTML=html
  }catch(e){
    resultEl.innerHTML='<div style="text-align:center;padding:40px;color:var(--danger)">❌ 诊断异常: '+escHtml(e.message)+'</div>'
  }
}

async function renderSvcMgr(el){
  el.innerHTML='<div style="max-width:900px;margin:0 auto"><div style="background:var(--card-bg);border-radius:10px;padding:16px 20px;box-shadow:var(--shadow);margin-bottom:12px"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><h3 style="font-size:14px;font-weight:600;margin:0">📋 系统服务管理</h3><input id="svcSearchInput" type="text" placeholder="搜索服务名称..." style="flex:1;min-width:160px;padding:7px 10px;border:1px solid #ddd;border-radius:6px;font-size:12px;outline:none" onkeydown="if(event.key===\'Enter\')refreshSvcList()"><select id="svcStateFilter" style="padding:7px 10px;border:1px solid #ddd;border-radius:6px;font-size:12px;outline:none"><option value="all">全部状态</option><option value="active">运行中</option><option value="inactive">已停止</option><option value="failed">失败</option></select><button class="btn btn-primary" onclick="refreshSvcList()">🔄 刷新</button></div></div><div id="svcListResult"><div style="text-align:center;padding:40px;color:var(--text-sec)">点击「刷新」查看服务列表</div></div></div>'
}

async function refreshSvcList(){
  var el=document.getElementById('svcListResult')
  if(!el)return
  el.innerHTML='<div style="text-align:center;padding:40px;color:var(--text-sec)">⏳ 正在获取服务列表...</div>'
  var keyword=document.getElementById('svcSearchInput')?.value?.trim()||''
  var stateFilter=document.getElementById('svcStateFilter')?.value||'all'
  try{
    var res=await window.svcAPI?.list({keyword:keyword,state:stateFilter})
    if(!res||!res.success){
      el.innerHTML='<div style="text-align:center;padding:40px;color:var(--danger)">❌ 获取服务列表失败'+(res?': '+escHtml(res.error):'')+'</div>';return
    }
    var services=res.services||[]
    if(services.length===0){el.innerHTML='<div style="text-align:center;padding:40px;color:var(--text-sec)">未找到匹配的服务</div>';return}
    var html='<div style="background:var(--card-bg);border-radius:8px;overflow:hidden;box-shadow:var(--shadow)"><div style="overflow-x:auto"><table class="monitor-table" style="font-size:12px;width:100%">'
    html+='<thead><tr><th style="width:30px"></th><th>服务名称</th><th>状态</th><th style="width:70px">子状态</th><th style="width:70px">开机自启</th><th style="width:120px">操作</th></tr></thead><tbody>'
    for(var i=0;i<services.length;i++){
      var sv=services[i];var isActive=sv.active||sv.state==='active';var isEnabled=sv.enabled||sv.subState==='enabled'
      html+='<tr><td style="text-align:center;font-size:14px">'+(isActive?'✅':'⏹')+'</td>'
      html+='<td style="font-family:monospace;font-size:11px;word-break:break-all;max-width:250px" title="'+escHtml(sv.description||'')+'">'+escHtml(sv.name||sv.unit||'')+'</td>'
      html+='<td>'+(isActive?'<span style="color:var(--success)">● 运行中</span>':'<span style="color:var(--text-sec)">○ 已停止</span>')+'</td>'
      html+='<td style="text-align:center">'+escHtml(sv.subState||'-')+'</td>'
      html+='<td style="text-align:center">'+(isEnabled?'<span style="color:var(--success)">已启用</span>':'<span style="color:var(--text-sec)">已禁用</span>')+'</td>'
      html+='<td style="white-space:nowrap">'
      if(isActive) html+='<button class="btn btn-sm" onclick="svcAction(\''+escHtml(sv.name)+'\',\'stop\')" style="font-size:10px;padding:2px 8px;color:var(--danger);border-color:var(--danger)">停止</button> '
      else html+='<button class="btn btn-sm" onclick="svcAction(\''+escHtml(sv.name)+'\',\'start\')" style="font-size:10px;padding:2px 8px;color:var(--success);border-color:var(--success)">启动</button> '
      html+='<button class="btn btn-sm" onclick="svcAction(\''+escHtml(sv.name)+'\',\'restart\')" style="font-size:10px;padding:2px 8px">重启</button>'
      html+='</td></tr>'
    }
    html+='</tbody></table></div><div style="padding:8px 16px;font-size:11px;color:var(--text-sec);border-top:1px solid var(--border)">共 '+services.length+' 个服务</div></div>'
    el.innerHTML=html
  }catch(e){el.innerHTML='<div style="text-align:center;padding:40px;color:var(--danger)">❌ 获取失败: '+escHtml(e.message)+'</div>'}
}

async function svcAction(name,action){
  var pwd=prompt('请输入管理员密码以'+(action==='start'?'启动':action==='stop'?'停止':'重启')+'服务「'+name+'」:')
  if(!pwd)return
  var el=document.getElementById('svcListResult')
  if(el)el.innerHTML='<div style="text-align:center;padding:20px;color:var(--text-sec)">⏳ 正在'+(action==='start'?'启动':action==='stop'?'停止':'重启')+'服务...</div>'
  try{
    var res=await window.svcAPI?.action({name:name,action:action,password:pwd})
    if(res&&res.success){setTimeout(refreshSvcList,500)}
    else{if(el)el.innerHTML='<div style="text-align:center;padding:20px;color:var(--danger)">❌ '+(res&&res.error||'操作失败')+'</div>'}
  }catch(e){if(el)el.innerHTML='<div style="text-align:center;padding:40px;color:var(--danger)">❌ '+escHtml(e.message)+'</div>'}
}

      html+='<td style="font-family:monospace;font-size:11px">'+escHtml(u.shell||'-')+'</td>'
      html+='<td style="white-space:nowrap">'

async function doAddUser(){

    var res=await window.userAPI?.add({username:username,fullname:fullname,password:pwd,sudo:sudo})
    if(res&&res.success){resultEl.innerHTML='<div class="l success">✅ 用户创建成功</div>';setTimeout(function(){closeModal();refreshUserList()},1000)}
    else{resultEl.innerHTML='<div class="l error">❌ '+(res&&res.error||'创建失败')+'</div>'}

async function doChpwd(username){

async function refreshCronList(){
  var el=document.getElementById('cronListResult')
  if(!el)return
  el.innerHTML='<div style="text-align:center;padding:40px;color:var(--text-sec)">⏳ 正在获取定时任务...</div>'
  try{
    var res=await window.cronAPI?.list()
    if(!res||!res.success){el.innerHTML='<div style="text-align:center;padding:40px;color:var(--danger)">❌ 获取失败'+(res?': '+escHtml(res.error):'无法连接到主进程')+'</div>';return}
    var lines=res.lines||[]
    var html='<div style="background:var(--card-bg);border-radius:8px;overflow:hidden;box-shadow:var(--shadow)">'
    if(lines.length===0){html+='<div style="text-align:center;padding:30px;color:var(--text-sec)">当前用户没有定时任务</div>'}
    else{
      html+='<div style="overflow-x:auto"><table class="monitor-table" style="font-size:12px;width:100%">'
      html+='<thead><tr><th style="width:70px">行号</th><th>定时任务</th><th style="width:80px">操作</th></tr></thead><tbody>'
      for(var i=0;i<lines.length;i++){
        var l=lines[i];var isComment=l.trim().startsWith('#')
        html+='<tr'+(isComment?' style="color:var(--text-ter);background:#f9f9f9"':'')+'>'
        html+='<td style="text-align:center">'+(i+1)+'</td>'
        html+='<td style="font-family:monospace;font-size:11px;word-break:break-all">'+escHtml(l)+'</td>'
        html+='<td style="text-align:center">'
        if(!isComment&&l.trim()) html+='<button class="btn btn-sm" onclick="removeCronLine('+(i+1)+')" style="font-size:10px;padding:2px 8px;color:var(--danger);border-color:var(--danger)">删除</button>'
        else html+='<span style="font-size:10px;color:var(--text-ter)">注释</span>'
        html+='</td></tr>'
      }
      html+='</tbody></table></div>'
    }
    html+='</div>';el.innerHTML=html
  }catch(e){el.innerHTML='<div style="text-align:center;padding:40px;color:var(--danger)">❌ 获取失败: '+escHtml(e.message)+'</div>'}
}

function showAddCron(){
  openModal()
  document.getElementById('modalContent').innerHTML='<button class="close-btn" onclick="closeModal()">X</button><h2>⏰ 添加定时任务</h2><div style="margin:16px 0"><div style="margin-bottom:10px"><label style="font-size:12px;color:var(--text-sec);display:block;margin-bottom:4px">Cron 表达式</label><div style="display:flex;gap:4px;flex-wrap:wrap"><input id="cronMin" placeholder="分" value="*" style="width:50px;padding:8px 6px;border:1px solid #ddd;border-radius:4px;font-size:13px;text-align:center;outline:none"><input id="cronHour" placeholder="时" value="*" style="width:50px;padding:8px 6px;border:1px solid #ddd;border-radius:4px;font-size:13px;text-align:center;outline:none"><input id="cronDay" placeholder="日" value="*" style="width:50px;padding:8px 6px;border:1px solid #ddd;border-radius:4px;font-size:13px;text-align:center;outline:none"><input id="cronMonth" placeholder="月" value="*" style="width:50px;padding:8px 6px;border:1px solid #ddd;border-radius:4px;font-size:13px;text-align:center;outline:none"><input id="cronWeek" placeholder="周" value="*" style="width:50px;padding:8px 6px;border:1px solid #ddd;border-radius:4px;font-size:13px;text-align:center;outline:none"></div></div><div style="margin-bottom:10px"><label style="font-size:12px;color:var(--text-sec);display:block;margin-bottom:4px">执行命令</label><input id="cronCommand" type="text" placeholder="/usr/bin/command" style="width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:13px;outline:none"></div><div style="background:#f0f7ff;border-radius:6px;padding:10px;font-size:11px;line-height:1.6;color:var(--primary)"><strong>💡 Cron 格式说明：</strong>分 时 日 月 周<br>每个字段可以输入数字、*（任意）、逗号分隔列表（如 1,3,5）或 */N 每 N 单位</div></div><div class="modal-output" id="addCronResult" style="display:none"></div><div class="modal-footer"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="doAddCron()">添加任务</button></div>'
}

async function doAddCron(){
  var min=document.getElementById('cronMin')?.value?.trim()||'*';var hour=document.getElementById('cronHour')?.value?.trim()||'*'
  var day=document.getElementById('cronDay')?.value?.trim()||'*';var month=document.getElementById('cronMonth')?.value?.trim()||'*'
  var week=document.getElementById('cronWeek')?.value?.trim()||'*';var cmd=document.getElementById('cronCommand')?.value?.trim()
  var resultEl=document.getElementById('addCronResult')
  if(!cmd)return alert('请输入要执行的命令')
  resultEl.style.display='block';resultEl.innerHTML='<div class="l info">⏳ 正在添加定时任务...</div>'
  try{
    var cronLine=min+' '+hour+' '+day+' '+month+' '+week+' '+cmd
    var res=await window.cronAPI?.add({line:cronLine})
    if(res&&res.success){resultEl.innerHTML='<div class="l success">✅ 任务添加成功</div>';setTimeout(function(){closeModal();refreshCronList()},1000)}
    else{resultEl.innerHTML='<div class="l error">❌ '+(res&&res.error||'添加失败')+'</div>'}
  }catch(e){resultEl.innerHTML='<div class="l error">❌ '+escHtml(e.message)+'</div>'}
}

async function removeCronLine(lineNum){
  if(!confirm('确定要删除第 '+lineNum+' 行吗？'))return
  var pwd=prompt('请输入管理员密码以删除定时任务:')
  if(!pwd)return
  var el=document.getElementById('cronListResult')
  if(el)el.innerHTML='<div style="text-align:center;padding:20px;color:var(--text-sec)">⏳ 正在删除...</div>'
  try{
    var res=await window.cronAPI?.remove({line:lineNum,password:pwd})
    if(res&&res.success){refreshCronList()}
    else{if(el)el.innerHTML='<div style="text-align:center;padding:20px;color:var(--danger)">❌ '+(res&&res.error||'删除失败')+'</div>'}
  }catch(e){if(el)el.innerHTML='<div style="text-align:center;padding:40px;color:var(--danger)">❌ '+escHtml(e.message)+'</div>'}
}

</script>
<script src="init.js"></script>
<div id="toastContainer" class="toast-container"></div>
</body>
